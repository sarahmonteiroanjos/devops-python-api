name: CI e Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1       # região (sem a letra da zona), ex.: us-east-1
  CONTAINER_NAME: devops-python-api
  APP_PORT: "8000"

permissions:
  contents: read

# Em pull request, uma execução nova cancela a anterior.
# Em push na main, nunca cancela, para não interromper um deploy no meio.
concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-and-tests:
    name: Qualidade e testes
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verificar análise estática
        run: ruff check .

      - name: Verificar formatação
        run: ruff format --check .

      - name: Executar testes e cobertura
        run: |
          mkdir -p reports
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=reports/junit.xml

      - name: Guardar relatórios da execução
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: |
            coverage.xml
            reports/junit.xml
          if-no-files-found: error
          retention-days: 7

  container-smoke-test:
    name: Build e teste do container
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Construir a imagem
        run: docker build --tag devops-python-api:${{ github.sha }} .

      - name: Iniciar o container
        run: |
          docker run \
            --detach \
            --name devops-python-api \
            --publish 8000:8000 \
            devops-python-api:${{ github.sha }}

      - name: Verificar o endpoint de saúde
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            echo "Tentativa ${attempt}: API ainda não está pronta"
            sleep 1
          done
          exit 1

      - name: Mostrar logs do container
        if: always()
        run: docker logs devops-python-api

      - name: Remover o container
        if: always()
        run: docker rm --force devops-python-api

  deploy:
    name: Deploy na AWS (EC2)
    needs: container-smoke-test
    # Só faz deploy em push na main, nunca em pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Nome exato do environment que guarda os secrets e variáveis (Settings > Environments)
    environment: DES

    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_USER: ${{ vars.EC2_USER }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir e enviar a imagem para o ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          REPO="${ECR_REPOSITORY%/}"
          IMAGE="$ECR_REGISTRY/$REPO:$IMAGE_TAG"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Preparar acesso SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Atualizar o container na EC2
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          SSH="ssh -i $HOME/.ssh/ec2_key $EC2_USER@$EC2_HOST"

          # Login no ECR dentro da EC2, usando a senha gerada aqui no runner
          aws ecr get-login-password --region "$AWS_REGION" \
            | $SSH "docker login --username AWS --password-stdin $REGISTRY"

          $SSH "docker pull $IMAGE \
            && (docker rm --force $CONTAINER_NAME || true) \
            && docker run --detach --name $CONTAINER_NAME --restart unless-stopped \
                 --publish $APP_PORT:8000 $IMAGE"

      - name: Verificar o endpoint de saúde na EC2
        run: |
          SSH="ssh -i $HOME/.ssh/ec2_key $EC2_USER@$EC2_HOST"
          for attempt in {1..20}; do
            if $SSH "curl --fail --silent http://127.0.0.1:$APP_PORT/health"; then
              exit 0
            fi
            echo "Tentativa ${attempt}: API ainda não está pronta"
            sleep 2
          done
          $SSH "docker logs $CONTAINER_NAME" || true
          exit 1

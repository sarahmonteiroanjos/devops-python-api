name: CI e Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: MY_AWS_REGION                   # região da AWS, ex.: us-east-1
  ECR_REPOSITORY: MY_ECR_REPOSITORY           # nome do repositório no ECR
  ECS_SERVICE: MY_ECS_SERVICE                 # nome do serviço no ECS
  ECS_CLUSTER: MY_ECS_CLUSTER                 # nome do cluster no ECS
  ECS_TASK_DEFINITION: MY_ECS_TASK_DEFINITION # caminho do JSON, ex.: .aws/task-definition.json
  CONTAINER_NAME: MY_CONTAINER_NAME           # nome do container dentro da task definition

permissions:
  contents: read

# Em pull request, uma execução nova cancela a anterior.
# Em push na main, nunca cancela, para não interromper um deploy no meio.
concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-and-tests:
    name: Qualidade e testes
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verificar análise estática
        run: ruff check .

      - name: Verificar formatação
        run: ruff format --check .

      - name: Executar testes e cobertura
        run: |
          mkdir -p reports
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=reports/junit.xml

      - name: Guardar relatórios da execução
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: |
            coverage.xml
            reports/junit.xml
          if-no-files-found: error
          retention-days: 7

  container-smoke-test:
    name: Build e teste do container
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Construir a imagem
        run: docker build --tag devops-python-api:${{ github.sha }} .

      - name: Iniciar o container
        run: |
          docker run \
            --detach \
            --name devops-python-api \
            --publish 8000:8000 \
            devops-python-api:${{ github.sha }}

      - name: Verificar o endpoint de saúde
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            echo "Tentativa ${attempt}: API ainda não está pronta"
            sleep 1
          done
          exit 1

      - name: Mostrar logs do container
        if: always()
        run: docker logs devops-python-api

      - name: Remover o container
        if: always()
        run: docker rm --force devops-python-api

  deploy:
    name: Deploy na AWS (ECS)
    needs: container-smoke-test
    # Só faz deploy em push na main, nunca em pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir e enviar a imagem para o ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Atualizar a imagem na task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Publicar a task definition no ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
